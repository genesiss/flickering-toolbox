site_name: Flickering Toolbox
site_description: A Python library for generating visual flickering stimuli for cognitive science research
site_author: Uroš Kosič
repo_url: https://github.com/genesiss/flickering-toolbox
repo_name: flickering-toolbox

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started.md
      - Quick Start: quick-start.md
  - User Guide:
      - Using as a Library: user-guide.md
      - Configuration: configuration.md
  - Examples:
      - Basic Usage: examples.md
      - Low-Level API: examples-lowlevel.md
  - Concepts:
      - SSVEP vs c-VEP: paradigms.md
  - API Reference:
      - Core Functions: api-core.md
  - Troubleshooting: troubleshooting.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            docstring_style: google
